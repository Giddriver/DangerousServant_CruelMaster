<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dangerous Servant / Cruel Master</title>
<style>
:root{--bg:#0f0d14;--panel:#1a1622;--line:#2e2838;--text:#e6e0ee;--dim:#9a90a8;--mind:#5aa0ff;--ill:#c04de0;--gold:#e0b84d;--sus:#e05a4d;--ok:#5ad08a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Georgia,serif}
h1,h2,h3{margin:.2em 0;font-weight:normal}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
button{font:inherit;background:#2a2336;color:var(--text);border:1px solid #4a3f5c;border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){background:#3a3050}
button:disabled{opacity:.4;cursor:default}
button.primary{background:#4b2a63;border-color:#7a4aa0}
button.risk{border-color:#a0704a;color:#f0c9a0}
button.danger{background:#6a2430;border-color:#c0505a}
#app{max-width:1440px;margin:0 auto;padding:10px;display:grid;gap:10px;grid-template-columns:330px minmax(0,1fr) 320px;grid-template-areas:"hud hud hud" "left map side"}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
#hud{grid-area:hud;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#hud .ttl{font-size:17px;letter-spacing:.06em}
#hud b{font-weight:normal;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
#willwrap{flex:1;min-width:300px}
.bar{height:22px;background:#000;border-radius:5px;position:relative;overflow:hidden}
.bar>div{position:absolute;top:0;bottom:0;transition:all .4s}
.bar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:22px;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.pip{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--mind);margin-right:3px;vertical-align:-1px}
.pip.on{background:var(--mind);box-shadow:0 0 6px var(--mind)}
#left{grid-area:left;display:flex;flex-direction:column;gap:10px}
#mapcol{grid-area:map}
#side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-height:0}
.scene svg{display:block;width:100%;border-radius:6px}
.cap{font-size:13px;min-height:36px;margin-top:6px}
.cap small{color:var(--dim);display:block}
.mapbars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;font-size:12px;color:var(--dim)}
#map{display:block;width:100%;border-radius:6px;background:#0c0a11}
.tgt{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding:6px 0}
.tgt.held b{color:var(--ok)}
.tgt b{font-weight:normal}
.tgt small{color:var(--dim);display:block}
.tgt .btns{display:flex;flex-direction:column;gap:3px;flex:none}
.tgt button{font-size:12px;padding:3px 7px}
.perk{color:var(--dim);font-size:13px;margin-bottom:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{font-size:13px;text-align:left}
.acts small{display:block;color:var(--dim);font-size:11px}
#log{flex:1;min-height:120px;max-height:230px;overflow:auto;font-size:12.5px}
#log p{margin:3px 0}
.ill{color:var(--ill)}.bad{color:var(--sus)}.good{color:var(--ok)}.gold{color:var(--gold)}.dim{color:var(--dim)}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .panel{max-width:640px;width:100%;max-height:92vh;overflow:auto;font-size:15px}
.hidden{display:none}
@media(max-width:1050px){#app{grid-template-columns:1fr;grid-template-areas:"hud" "map" "side" "left"}}

/* ---- scene animation ---- */
.tent{transform-box:view-box;animation:sway 3.2s ease-in-out infinite alternate}
.t1{transform-origin:150px 76px}.t2{transform-origin:157px 78px;animation-delay:-.8s}.t3{transform-origin:163px 78px;animation-delay:-1.7s}.t4{transform-origin:170px 76px;animation-delay:-2.4s}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.a1 .tent{animation-duration:2s}.a2 .tent{animation-duration:1.1s}.a3 .tent{animation-duration:.5s}
.breath{animation:breath 4s ease-in-out infinite alternate;transform-box:view-box;transform-origin:160px 204px}
@keyframes breath{from{transform:scaleY(1)}to{transform:scaleY(1.02)}}
.a3 #illg{animation:shake .25s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}75%{transform:translate(-1.5px,1px)}}
.eye{fill:#f2d0ff;filter:drop-shadow(0 0 3px #d070ff);opacity:.75}
.a1 .eye{opacity:.9}.a2 .eye{opacity:1;filter:drop-shadow(0 0 6px #e080ff)}.a3 .eye{fill:#fff;filter:drop-shadow(0 0 9px #ff80ff)}
.sated .eye{opacity:.2}.sated .tent{animation-duration:7s}
.ward{fill:none;stroke:var(--mind);transition:all .5s}
.crack{stroke:#e6a0ff;stroke-width:1.5;fill:none;opacity:0;transition:opacity .5s}
.c1 .k1,.c2 .k1,.c2 .k2,.c3 .crack{opacity:.9}
.pose{display:none}
.p-idle #stand,.p-dominate #stand,.p-brace #stand,.p-borrow #stand,.p-feed #stand,.p-meditate #sit,.p-lielow #crouch{display:block}
.arm{display:none}
.p-idle .a-idle,.p-feed .a-head,.p-brace .a-head,.p-dominate .a-reach,.p-borrow .a-idle{display:block}
#thread,#rings,#shut,#veins{display:none}
.p-dominate #thread,.p-meditate #rings,.p-lielow #shut,.p-borrow #veins,.p-brace #veins{display:block}
.p-lielow #flame,.p-lielow #glowc{display:none}
#thread path{stroke-dasharray:6 5;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
#flame{animation:flick .18s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.9,1.12)}}
#rings ellipse{fill:none;stroke:var(--mind);animation:rise 2.4s linear infinite}
#rings ellipse:nth-child(2){animation-delay:-.8s}#rings ellipse:nth-child(3){animation-delay:-1.6s}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-70px);opacity:0}}
.wglow{fill:#8fd0ff;opacity:0}.p-dominate .wglow,.p-meditate .wglow{opacity:1}.p-borrow .wglow,.p-brace .wglow{opacity:1;fill:#e080ff}
/* map */
.dist{cursor:pointer}
.dist:hover .halo{opacity:.35}
.halo{fill:#fff;opacity:0;transition:opacity .2s}
.sel .halo{opacity:.18;stroke:#fff;stroke-width:1.5}
.lbl{font:11px Georgia,serif;fill:#cfc6dc;text-anchor:middle;paint-order:stroke;stroke:#0c0a11;stroke-width:3px}
.tok{stroke-width:1.5}
.tok.locked{fill:#15121b;stroke:#4a4258}
.tok.open{fill:#15121b;stroke:#cfc6dc}
.tok.held{fill:url(#tokg);stroke:#f0c8ff;filter:drop-shadow(0 0 4px #c04de0)}
.opp{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:3 3;animation:dash 1.2s linear infinite}
.thr{fill:none;stroke:url(#thrg);stroke-dasharray:2 6;stroke-linecap:round;animation:dash 1.4s linear infinite;opacity:.8}
.inq{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.65}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="panel">
    <div class="ttl">Dangerous Servant <span class="ill">/</span> Cruel Master</div>
    <div><b>Night</b><span id="turn"></span></div>
    <div><b>Gold</b><span id="gold" class="gold"></span></div>
    <div><b>Actions</b><span id="ap"></span></div>
    <div id="willwrap">
      <div class="bar" title="Your whole mind. Grey is spent holding thralls. Purple is what the Illithid will push with tonight. Blue is what is left to absorb a surge.">

        <g stroke="url(#barg)" stroke-width="8"><path d="M20 0V230M76 0V230M132 0V230M188 0V230M244 0V230M300 0V230" stroke="#0a080d"/></g>
        <g stroke="#2d2836" stroke-width="1.5"><path d="M18 0V230M74 0V230M130 0V230M186 0V230M242 0V230M298 0V230"/></g>
        <path d="M0 8H320" stroke="#0a080d" stroke-width="9"/><path d="M0 5H320" stroke="#2d2836" stroke-width="1.5"/>
      </svg>
      <div class="cap"><span id="iOmen" class="ill"></span><small id="iRest"></small><small id="iIntel"></small></div>
    </div>
    <div class="panel scene">
      <h3 style="color:var(--mind)">Your garret</h3>
      <svg id="sanct" viewBox="0 0 320 200">
        <defs>
          <linearGradient id="thg" x1="0" x2="1"><stop offset="0" stop-color="#5aa0ff"/><stop offset="1" stop-color="#c04de0"/></linearGradient>

        <!-- window -->
        <rect x="226" y="56" width="62" height="70" fill="#101a33"/>
        <circle cx="272" cy="72" r="8" fill="#e8e6d0"/>
        <path d="M226 126v-16h8v-8h6v8h8v-22l4-10 4 10v22h10v-12h8v12h14v16Z" fill="#070910"/>

        <g id="stand" class="pose">

          <path d="M150 92C133 96 127 122 122 176H178C173 122 167 96 150 92Z" fill="#2b3550" stroke="#41507a"/>
          <path d="M150 100V176M139 112Q135 146 133 176" stroke="#222a42" fill="none"/>
          <path d="M150 64C136 64 131 78 133 92C139 100 161 100 167 92C169 78 164 64 150 64Z" fill="#222b45" stroke="#41507a"/>
          <ellipse cx="150" cy="84" rx="8" ry="9" fill="#c9a98c"/><path d="M142 80Q150 74 158 80V76Q150 70 142 76Z" fill="#141a2c"/>
          <circle class="wglow" cx="146.5" cy="84" r="1.6"/><circle class="wglow" cx="153.5" cy="84" r="1.6"/>

          <path d="M258 112C247 112 243 122 245 132C250 138 266 138 271 132C273 122 269 112 258 112Z" fill="#161c2e" stroke="#2c3654"/>

  </div>

  <div id="mapcol" class="panel">
    <div class="mapbars">
      <div>The High Magister's suspicion<div class="bar"><div id="sBar" style="background:var(--sus)"></div><span id="sTxt"></span></div></div>
      <div>Caldreth subverted<div class="bar"><div id="vBar" style="background:var(--ok)"></div><span id="vTxt"></span></div></div>
    </div>
    <div id="mag" style="font-size:13px;min-height:38px;margin-bottom:6px"></div>
    <svg id="map" viewBox="0 0 640 520"></svg>
  </div>

  <div id="side">
    <div class="panel" id="detail"></div>
    <div class="panel">
      <h3>Your own actions</h3>
      <div class="acts">
        <button id="bMed" onclick="act('meditate')">Meditate<small id="medS"></small></button>

    <div class="panel" id="log"></div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="panel" id="mbody"></div></div>

<script>
// ---------- Data ----------
const TIER = [
  {upkeep:4, gold:10, sus:5,  force:.60, r:6},
  {upkeep:7, gold:25, sus:9,  force:.45, r:7.5},
  {upkeep:11,gold:50, sus:14, force:.30, r:9},
];
const MAXMIND=70;
const INST = [
  {id:'coin', x:330,y:285, name:'The Gilded Consortium', perk:'Merchant guild. Each thrall earns +3 gold per rank, every night. A rank 2 thrall can bribe officials and can bury the Magister\'s audits.',
   people:['Ledger-clerk Pell','Factor Imra Dole','Guildmaster Osk Varrin']},
  {id:'watch',x:530,y:275, name:'The Ashen Watch', perk:'City guard. Each thrall lowers suspicion by 1 per rank every night, and makes the Inquisitor 5% per rank less likely to expose anyone. A rank 2 thrall can call off the Inquisitor and can lose the warrants for a purge.',
   people:['Sergeant Hale','Captain Bree Tamsin','Lord-Marshal Cade Orwen']},
  {id:'temple',x:112,y:280, name:'Temple of the Still Flame', perk:'Clergy. Their vigil weakens every surge by 2 per rank held here, and meditation grants +1 mind per rank. A rank 2 thrall can blind the Magister\'s scrying.',
   people:['Acolyte Senn','Confessor Mirelle','The Hierarch Aubric']},
  {id:'court',x:185,y:140, name:'The Lantern Court', perk:'Noble houses. Court gossip covers your tracks: taking a mind raises 1 less suspicion per rank held here. A rank 2 thrall can speak against any order of the Magister. The Lady Chancellor grants +1 action every night.',
   people:['Page Willem','Baron Tesk Ardane','Lady Chancellor Ysolde Crane']},
  {id:'under',x:210,y:432, name:'The Undercroft', perk:'Thieves and spies. They watch the cell: rank 1 gives surge odds, rank 2 says whether a surge comes, rank 3 gives its size and +15% to every Force. A rank 2 thrall can blackmail anyone in the city and can slip you past a curfew.',
   people:['Cutpurse Nim','Fence Old Marrow','The Mother of Keys']},
  {id:'coll', x:462,y:140, name:'Collegium of the Ninth Seal', perk:'The High Magister\'s own academy. Its wards weaken the Illithid by 1 per rank. A rank 2 thrall can unpick his mind-wards. You need its Provost to confront him. Double suspicion.',
   people:['Apprentice Lio','Warden-Magus Fenna','Provost Dravik Sol']},
];
const SCHEME={
  coin:['Bribe an official','20 gold: −8 suspicion'],
  watch:['Call off the Inquisitor','He leaves, or never arrives'],
  under:['Blackmail…','Make anyone an opening for two nights'],
  court:['Speak against the Magister','Cancels his pending order']};
// The High Magister's orders. Each is announced a night ahead and can be stopped by a rank 2+ thrall in one institution.
const EDICTS={
  purge:{by:'watch',say:e=>`will purge ${INST[e.i].name}: every thrall there has a 50% chance of exposure`,
    hit:e=>{let n=0;thralls().filter(k=>instOf(k)===e.i).forEach(k=>{if(R()<.5){release(k,true);S.sus+=8;n++;}});
      log(`The Magister's purge sweeps ${INST[e.i].name}. `+(n?`${n} of your thralls ${n>1?'are':'is'} dragged out and broken. (+${n*8} suspicion)`:'It finds nothing.'),'bad');}},
  scry:{by:'temple',say:()=>'will scry the whole city for mind magic (+15 suspicion)',
    hit:()=>{S.sus+=15;log('Veyl Sarrow\'s scrying passes over the rooftops like a cold hand, and lingers near your street. (+15 suspicion)','bad');}},
  audit:{by:'coin',say:()=>'will audit the guilds and seize half your gold',
    hit:()=>{const g=S.gold>>1;S.gold-=g;log(`The Magister's auditors follow the money. You lose ${g} gold.`,'bad');}},
  curfew:{by:'under',say:()=>'will impose a curfew (1 fewer action tomorrow night)',
    hit:()=>{S.curfew=true;log('Curfew bells. The streets are empty and your reach is short tonight. (−1 action)','bad');}},
  informers:{by:'court',say:()=>'will post a bounty for informers (taking minds raises double suspicion for 3 nights)',
    hit:()=>{S.informers=4;log('A royal bounty for informers is cried in every square. Everyone is watching everyone. (double suspicion from taking minds, 3 nights)','bad');}},
  wards:{by:'coll',say:()=>'will raise mind-wards over the city (Force odds −20% for 3 nights)',
    hit:()=>{S.wards=4;log('The Magister raises wards over Caldreth. Unprepared minds are harder to break. (Force −20%, 3 nights)','bad');}}};
const pick=a=>a[Math.floor(R()*a.length)];
const gain=n=>{S.mind=Math.min(MAXMIND,S.mind+n);};
// Night events: [label, effect returning the outcome text, optional condition]
const EVENTS=[
  {t:'A thrall wavers',ok:()=>thralls().length>0,pre:()=>{S.ev.k=pick(thralls());},
   x:()=>`${nameOf(S.ev.k)} has started weeping at odd moments. Something of them is still in there, pushing back.`,
   o:[['Bear down on them (−3 mind)',()=>{S.mind-=3;return 'You crush the last of their resistance. It costs you.';}],
      ['Let them go quietly',()=>`You ease out of ${release(S.ev.k,true)}'s mind. They remember nothing.`],
      ['Trust your hold (50%: they wake screaming)',()=>{if(R()<.5)return 'The moment passes. They are still yours.';S.sus+=8;return `${release(S.ev.k,true)} wakes screaming in the street. (+8 suspicion)`;}]]},
  {t:'The Festival of Lanterns',x:()=>'The whole city is in the streets tonight, masked and drunk.',
   o:[['Work under cover of the crowd (your next taking tonight raises no suspicion)',()=>{S.quiet=true;return 'Nobody notices one more glassy stare tonight.';}],
      ['Rest while the city drinks (+6 mind)',()=>{gain(6);return 'For one night you sleep like a person.';}],
      ['Have your thralls work the crowd (+15 gold)',()=>{S.gold+=15;return 'Purses are light in the morning.';}]]},
  {t:'A witness',x:()=>'A lamplighter has noticed the glow that leaks under your floorboards, and has started telling people.',
   o:[['Pay him to forget (15 gold)',()=>{S.gold-=15;return 'He decides it was a trick of the light.';},()=>S.gold>=15],
      ['Give him to the Illithid (it gains +1 power, sated 1 night)',()=>{S.ill.base++;S.ill.fedTurns=Math.max(S.ill.fedTurns,1);return 'There is no lamplighter on your street any more. The thing below is content, briefly.';}],
      ['Ignore him (+8 suspicion)',()=>{S.sus+=8;return 'The story spreads.';}]]},
  {t:'It speaks',x:()=>'For once the Illithid uses words. It offers you the Magister\'s private ciphers, in exchange for one deep breath of freedom.',
   o:[['Refuse',()=>'It laughs, wetly, for a long time.'],
      ['Accept (+15 subversion, Illithid +2 power)',()=>{S.sub=Math.min(100,S.sub+15);S.ill.base+=2;return 'The ciphers are real. So is the price.';}],
      ['Demand more (50%: +25 subversion; 50%: it lashes out)',()=>{S.ill.base+=2;if(R()<.5){S.sub=Math.min(100,S.sub+25);return 'It gives you everything. It seems pleased to. (+25 subversion, Illithid +2 power)';}S.ill.spikeChance=.6;return 'It takes its breath and gives you nothing. It is coiling to strike. (Illithid +2 power, a surge is likely)';}]]},
  {t:'Smugglers\' cargo',x:()=>'A barge of untaxed silk is sitting under the east bridge with two guards on it.',
   o:[['Have your people in the Undercroft lift it (+25 gold)',()=>{S.gold+=25;return 'By morning the barge is empty.';},()=>tiersIn('under')>0],
      ['Buy a share (10 gold; 50% to return 35)',()=>{S.gold-=10;if(R()<.5){S.gold+=35;return 'The silk sells. (+35 gold)';}return 'The Watch gets there first. Your stake is gone.';},()=>S.gold>=10],
      ['Leave it',()=>'Not your business.']]},
  {t:'A rival senses you',x:()=>'Adept Corvane Ysk, one of the Magister\'s students, felt the edge of your working and has come looking.',
   o:[['Buy his silence (20 gold)',()=>{S.gold-=20;return 'He is ambitious, and cheap.';},()=>S.gold>=20],
      ['Show him what is in the cell (surge odds +20%)',()=>{S.ill.spikeChance=Math.min(.6,S.ill.spikeChance+.2);return 'He runs, and does not stop at the city gate. The Illithid enjoyed him.';}],
      ['Do nothing (+10 suspicion)',()=>{S.sus+=10;return 'He goes to his master.';}]]},
  {t:'The king\'s fever',x:()=>'The king is ill, and the High Magister has not left his bedside in two days.',
   o:[['Use the distraction (+8 subversion)',()=>{S.sub=Math.min(100,S.sub+8);return 'Papers are signed that nobody reads.';}],
      ['Breathe (−5 suspicion, the Magister\'s next move is delayed)',()=>{S.sus=Math.max(0,S.sus-5);S.mag.eta+=3;return 'For a few nights nobody is hunting you.';}]]},
  {t:'A hanging',x:()=>'The Magister has found his "mind-witch": a herb-seller who never harmed anyone. She hangs at dawn.',
   o:[['Let her hang (−12 suspicion)',()=>{S.sus=Math.max(0,S.sus-12);return 'The city sleeps easier. You do not.';}],
      ['Free her through a thrall (+6 suspicion, +6 subversion)',()=>{S.sus+=6;S.sub=Math.min(100,S.sub+6);return 'A door is left unlocked. The Magister looks a fool.';},()=>thralls().length>0]]},
  {t:'An old tract',x:()=>'A treatise on mental discipline has surfaced in a bookstall by the river.',
   o:[['Buy and study it (15 gold, +8 mind)',()=>{S.gold-=15;gain(8);return 'Half of it is nonsense. The other half works.';},()=>S.gold>=15],
      ['Have it stolen and sold (+20 gold, +3 suspicion)',()=>{S.gold+=20;S.sus+=3;return 'A collector pays well.';}],
      ['Leave it',()=>'You walk on.']]},
  {t:'Its dreams',x:()=>'You fell asleep and dreamed the Illithid\'s dreams: dark water, and a great many minds.',
   o:[['Endure it (−4 mind)',()=>{S.mind-=4;return 'You wake with blood in your nose.';}],
      ['Poppy tincture (10 gold)',()=>{S.gold-=10;return 'No dreams at all.';},()=>S.gold>=10],
      ['Let it in a little (Illithid +1 power)',()=>{S.ill.base++;return 'It was only a dream. It was not only a dream.';}]]},
  {t:'Questions at home',ok:()=>thralls().some(k=>tierOf(k)>0),pre:()=>{S.ev.k=pick(thralls().filter(k=>tierOf(k)>0));},
   x:()=>`The family of ${nameOf(S.ev.k)} say they are not themselves lately, and have asked a priest to visit.`,
   o:[['Send gifts and excuses (15 gold)',()=>{S.gold-=15;return 'The priest finds a tired, generous relative.';},()=>S.gold>=15],
      ['Play the part yourself (−1 action tonight)',()=>{S.ap=Math.max(0,S.ap-1);return 'You spend half the night being somebody\'s loving father.';}],
      ['Ignore it (+7 suspicion)',()=>{S.sus+=7;return 'The priest writes a letter.';}]]},
  {t:'Dinner at court',ok:()=>tiersIn('court')>0,x:()=>'Your thrall at court is seated three places from the High Magister. He is drinking, and for once unguarded.',
   o:[['Only listen (+6 subversion)',()=>{S.sub=Math.min(100,S.sub+6);return 'He talks too much about the king\'s debts.';}],
      ['Slip a doubt into his mind (60%: −15 suspicion; 40%: +15)',()=>{if(R()<.6){S.sus=Math.max(0,S.sus-15);return 'He goes to bed certain he has been chasing shadows. (−15 suspicion)';}S.sus+=15;return 'He sets down his cup and looks slowly around the table. (+15 suspicion)';}]]},
  {t:'Alms day',ok:()=>tiersIn('temple')>0,x:()=>'Pilgrims fill the Temple of the Still Flame, and your clergy stand at the door.',
   o:[['Skim the plate (+12 gold)',()=>{S.gold+=12;return 'The Flame provides.';}],
      ['Sit in the quiet with them (+5 mind)',()=>{gain(5);return 'For an hour the thing below cannot find you.';}]]},
  {t:'A knock at the door',ok:()=>tiersIn('watch')===0,x:()=>'The Watch is going door to door along your street.',
   o:[['Bribe the sergeant (10 gold)',()=>{S.gold-=10;return 'He does not come upstairs.';},()=>S.gold>=10],
      ['Hide the trapdoor and wait (−1 action tonight)',()=>{S.ap=Math.max(0,S.ap-1);return 'They leave after an hour.';}],
      ['Bluff (50%: +10 suspicion)',()=>{if(R()<.5)return 'A poor scholar, nothing more. They move on.';S.sus+=10;return 'He writes something down. (+10 suspicion)';}]]},
];
const SPIRE={x:322,y:92}, GARRET={x:440,y:448};
const OPPS=['is deep in their cups tonight','walks home alone tonight','is sick with fever, their guard down','is grieving, and not sleeping','has been dabbling in a forbidden tract'];
const POSE={
  idle:'You stand over your map of the city, deciding.',
  meditate:'You sit in stillness, rebuilding the walls of your mind.',
  dominate:'You reach out through the Illithid, across the rooftops, into another mind.',
  lielow:'Candle out, shutters closed. You are nobody tonight.',
  feed:'You look away while it feeds. You can still hear it.',
  borrow:'Its strength runs through you like cold water. It felt you take it.',
  brace:'You clutch your skull as the thing below throws itself at your will.'};

// ---------- State ----------
let S;
function newGame(){
  S = {turn:1, ap:2, gold:30, mind:40, sus:0, sub:0,
       ill:{base:12, spikeChance:.10, fedTurns:0, next:null},
       held:{}, chan:false, borrowed:false, cloak:false, pose:'idle', sel:0,
       inq:{at:-1, next:-1, eta:4}, mag:{eta:6, edict:null, last:''}, cd:{}, ev:null, lastEv:-1,
       curfew:false, informers:0, wards:0, quiet:false, opp:null, pending:null, over:false, log:[]};
  rollNext();
  log('You hold the Illithid by a thread of will. Above the city, the High Magister Veyl Sarrow sits at the king\'s right hand, unaware.', 'ill');
  render();
}
const R=()=>Math.random();
const key=(i,t)=>INST[i].id+t;
const thralls=()=>Object.keys(S.held).filter(k=>S.held[k]);
const tierOf=k=>+k.slice(-1);
const instOf=k=>INST.findIndex(x=>k.startsWith(x.id)&&k.length===x.id.length+1);
const nameOf=k=>INST[instOf(k)].people[tierOf(k)];
const used=()=>thralls().reduce((a,k)=>a+TIER[tierOf(k)].upkeep,0);
const free=()=>S.mind-used();
const tiersIn=id=>thralls().filter(k=>INST[instOf(k)].id===id).reduce((a,k)=>a+tierOf(k)+1,0);
const has=(id,t)=>!!S.held[id+t];
const maxAP=()=>2+(has('court',2)?1:0);
const pushOf=base=>Math.max(5,base-tiersIn('coll')-(S.ill.fedTurns>0?8:0));
// Growth the Illithid gets at nightfall: +1 if you left it idle, +1 every second night (every night from night 20).
const growth=()=>(S.chan?0:1)+((S.turn+1)%2===0||S.turn>=20?1:0);
const tonight=()=>pushOf(S.ill.base+growth());
const margin=()=>free()-tonight();
const isOpp=k=>S.opp&&S.opp.k===k;
const goldCost=(i,t)=>isOpp(key(i,t))?Math.ceil(TIER[t].gold/2):TIER[t].gold;
const forceChance=(i,t)=>Math.max(.05,Math.min(.95,TIER[t].force+(t>0&&S.held[key(i,t-1)]?.1:0)+(isOpp(key(i,t))?.3:0)+(has('under',2)?.15:0)-(S.wards>0?.2:0)));
const susGain=(i,t)=>S.quiet?0:Math.max(1,TIER[t].sus-tiersIn('court'))*(INST[i].id==='coll'?2:1)*(S.informers>0?2:1);
const surge=()=>S.ill.next.spike?Math.max(0,S.ill.next.amt-2*tiersIn('temple')):0;
const exposeChance=()=>Math.max(.05,.35-.05*tiersIn('watch'));
const agent=id=>has(id,2)||has(id,1);

function rollNext(){
  const spike = R()<S.ill.spikeChance;
  S.ill.next={spike, amt: spike ? 8+Math.floor(R()*15) : 0};
}
function log(m,c=''){S.log.unshift(`<p class="${c}"><span class="dim">Night ${S.turn}.</span> ${m}</p>`);S.log=S.log.slice(0,80);}

// ---------- Actions ----------
function act(a){
  if(S.over) return;
  if(a==='feed') return feedMenu();
  if(a==='borrow'){
    if(S.borrowed) return;
    S.borrowed=true;S.ap++;S.ill.base++;S.pose='borrow';
    log('You drink from the Illithid\'s strength. One more action tonight. It is stronger for the exchange, forever. (Illithid +1 power)','ill');
    return render();
  }
  if(S.ap<1) return;
  if(a==='meditate'){const g=Math.min(3+tiersIn('temple'),MAXMIND-S.mind);if(g<=0) return;S.mind+=g;S.pose='meditate';log(`You meditate. Mind strength +${g}.`,'good');}
  if(a==='lielow'){S.sus=Math.max(0,S.sus-10);S.pose='lielow';log('You keep your head down. Suspicion −10.');}
  S.ap--;render();
}
function take(i,t,forced){
  const T=TIER[t],k=key(i,t),p=INST[i].people[t],opp=isOpp(k),mult=INST[i].id==='coll'?2:1;
  if(S.over||S.ap<1||S.held[k]||free()<T.upkeep||S.inq.at===i) return;
  if(!forced){
    if(S.gold<goldCost(i,t)||!(t===0||S.held[key(i,t-1)]||opp)) return;
    S.gold-=goldCost(i,t);
  }
  S.ap--;S.chan=true;S.pose='dominate';S.sel=i;
  if(forced&&R()>forceChance(i,t)){
    const sus=(T.sus+6)*mult;S.sus+=sus;S.ill.base++;S.pose='brace';
    log(`You hurl yourself at ${p}'s mind unprepared and it slams shut. They felt you. The Illithid savours your failure. (+${sus} suspicion, Illithid +1 power)`,'bad');
  } else {
    const sus=susGain(i,t),b=(t+1)*2;S.quiet=false;S.held[k]=true;S.sus+=sus;S.sub=Math.min(100,S.sub+b);
    if(opp)S.opp=null;
    log(`${forced?'You break into':'Through the Illithid you slip into'} ${p}'s mind. They are yours. (−${T.upkeep} free mind, +${sus} suspicion, +${b} subversion)`,'good');
  }
  render();checkSus();
}
function release(k,quiet){
  S.held[k]=false;
  const p=nameOf(k);
  if(!quiet){S.sus+=2;log(`You release ${p}. They wake confused. (+2 suspicion)`);render();checkSus();}
  return p;
}
function feedMenu(){
  if(S.ap<1) return;
  const list=thralls();
  if(!list.length){log('There is no mind to offer it.','bad');return render();}
  modal(`<h2 class="ill">Let it feed</h2><p>Offer a thrall's mind to the Illithid. It will be sated (−8 push for 3 nights), but it grows stronger forever (+2 power). The thrall is destroyed and the body will be found (+6 suspicion).</p>`+
    list.map(k=>`<button style="margin:3px" onclick="feed('${k}')">${nameOf(k)}</button>`).join('')+
    `<p><button onclick="closeModal()">Cancel</button></p>`);
}
function feed(k){
  closeModal();const p=release(k,true);
  S.ill.fedTurns=3;S.ill.base+=2;S.sus+=6;S.ap--;S.pose='feed';
  log(`The Illithid devours ${p}'s mind. It is quiet, for now. (+6 suspicion)`,'ill');
  render();checkSus();
}
function cloak(){
  if(S.over||S.ap<1||S.cloak||S.inq.at<0) return;
  S.ap--;S.cloak=true;S.pose='lielow';
  log(`You smooth your thralls' faces into their old habits. The Inquisitor will find nothing in ${INST[S.inq.at].name} tonight.`);
  render();
}
function seize(){
  if(S.over||S.ap<1||S.inq.at<0) return;
  const i=S.inq.at;S.ap--;S.chan=true;S.pose='dominate';
  if(R()<.5){
    S.sus=Math.max(0,S.sus-15);S.inq={at:-1,next:-1,eta:7};
    log('You catch the Inquisitor\'s mind mid-thought and turn it. He will report that Caldreth is clean. (−15 suspicion, he will not return for a while)','good');
  } else {
    S.sus+=15;S.pose='brace';
    const here=thralls().filter(k=>instOf(k)===i);
    let m='The Inquisitor\'s mind is warded. He staggers, and knows exactly what just touched him. (+15 suspicion)';
    if(here.length){const k=here[Math.floor(R()*here.length)];m+=` He turns on ${release(k,true)} at once; you lose them.`;}
    log(m,'bad');
  }
  render();checkSus();
}
function scheme(id){
  if(S.over||S.ap<1||(S.cd[id]||0)>0||!agent(id)) return;
  if(id==='under') return blackmailMenu();
  if(id==='coin'){if(S.gold<20||S.sus<=0)return;S.gold-=20;S.sus=Math.max(0,S.sus-8);log('Consortium gold changes hands in a back office. A report is misfiled. (−8 suspicion)','gold');}
  if(id==='watch'){if(S.inq.at<0&&S.inq.next<0)return;S.inq={at:-1,next:-1,eta:6};S.cd.watch=5;log('Your officer in the Watch sends Inquisitor Roake across the river after a rumour you invented.','good');}
  if(id==='court'){if(!S.mag.edict)return;S.mag.edict=null;S.mag.eta=5;S.cd.court=6;log('Your noble rises in the Lantern Court and calls the Magister\'s order an insult to the king. It is withdrawn.','good');}
  S.ap--;S.pose='idle';render();
}
function blackmailMenu(){
  let h='<h2>Blackmail</h2><p>Your people in the Undercroft know something about everyone. Choose who they lean on. For two nights that person can be taken at half cost, whatever their rank, and is far easier to Force.</p>';
  INST.forEach((I,i)=>{const l=I.people.map((p,t)=>S.held[key(i,t)]?'':`<button style="margin:2px" onclick="blackmail('${key(i,t)}')">${p}</button>`).join('');if(l)h+=`<div class="perk" style="margin:6px 0 0">${I.name}</div>`+l;});
  modal(h+'<p><button onclick="closeModal()">Cancel</button></p>');
}
function blackmail(k){
  closeModal();S.ap--;S.cd.under=4;S.opp={k,turns:2,why:'has had a quiet word from your people in the Undercroft'};S.sel=instOf(k);
  log(`An opening: ${nameOf(k)} ${S.opp.why}.`,'gold');render();
}
function counter(){
  const e=S.mag.edict;if(S.over||!e||S.ap<1||!agent(EDICTS[e.id].by)) return;
  const by=EDICTS[e.id].by,i=INST.findIndex(x=>x.id===by);
  S.ap--;S.mag.edict=null;S.mag.eta=S.sus>=60?3:S.sus>=30?4:6;
  log(`${INST[i].people[has(by,2)?2:1]} sees to it that the Magister's order comes to nothing.`,'good');render();
}
function moveMagister(){
  const m=S.mag;if(m.edict||--m.eta>0) return false;
  const c=['scry','curfew','informers','wards'];
  if(thralls().length)c.push('purge','purge');
  if(S.gold>=20)c.push('audit');
  let id=pick(c);if(id===m.last)id=pick(c);
  const cnt=INST.map((I,i)=>thralls().filter(k=>instOf(k)===i).length);
  m.last=id;m.edict={id,i:cnt.indexOf(Math.max(...cnt))};
  log(`Word from the Spire: at dawn the High Magister ${EDICTS[id].say(m.edict)}.`,'bad');
  return true;
}
function fireEvent(){
  const c=EVENTS.map((e,n)=>n).filter(n=>n!==S.lastEv&&(!EVENTS[n].ok||EVENTS[n].ok()));
  const n=pick(c),E=EVENTS[n];S.lastEv=n;S.ev={n};if(E.pre)E.pre();
  modal(`<h2 class="gold">${E.t}</h2><p>${E.x()}</p>`+E.o.map((o,j)=>`<p><button ${!o[2]||o[2]()?'':'disabled'} onclick="chooseEv(${j})">${o[0]}</button></p>`).join(''));
}
function chooseEv(j){
  const E=EVENTS[S.ev.n],o=E.o[j];if(o[2]&&!o[2]()) return;
  const out=o[1]();S.ev=null;
  log(`<i>${E.t}.</i> ${out}`,'gold');
  modal(`<h2 class="gold">${E.t}</h2><p>${out}</p><button class="primary" onclick="closeModal()">Continue</button>`);
  render();if(checkSus())return;
}
function confront(){
  if(!has('coll',2)||S.sub<100||S.ap<1||S.over) return;
  const push=Math.round(tonight()*2);
  modal(`<h2>The Confrontation</h2><p>You climb the Spire with the Collegium's Provost at your side and a kingdom already rotting under him. Veyl Sarrow recognises you, too late.</p>
  <p>To break his mind you must loose the Illithid's full power through yourself. In that instant it will strike back with <b class="ill">${push}</b> force. You have <b>${free()}</b> free mind.</p>
  <p>Release thralls first if you need to (but keep the Provost). This is your only chance.</p>
  <button class="primary" onclick="finalStrike(${push})">Strike</button> <button onclick="closeModal()">Not yet</button>`);
}
function finalStrike(push){
  closeModal();
  if(free()>=push) end(true,'The Magister\'s mind breaks against yours. Your family is avenged, and Caldreth answers to you now. But the thing in the cell is watching, and it is patient.');
  else end(false,'At the moment of triumph your grip slips. The Illithid surges through the gap and takes you both. The Magister is dead; so are you, in every way that matters.');
}

// ---------- Night ----------
function endTurn(){
  if(S.over||S.pending||S.ev) return;
  // thralls work
  const inc=5+thralls().filter(k=>k.startsWith('coin')).reduce((a,k)=>a+3*(tierOf(k)+1),0);
  S.gold+=inc;
  const sub=thralls().reduce((a,k)=>a+tierOf(k)+1,0);
  S.sub=Math.min(100,S.sub+sub);
  const heads=thralls().filter(k=>tierOf(k)===2).length;
  S.sus=Math.max(0,S.sus+heads-tiersIn('watch'));
  log(`Your thralls work in the shadows: +${inc} gold${sub?`, +${sub} subversion`:''}.`,'gold');
  // the Inquisitor searches
  if(S.inq.at>=0&&!S.cloak){
    const ch=exposeChance();
    thralls().filter(k=>instOf(k)===S.inq.at).forEach(k=>{
      if(R()<ch){S.sus+=10;log(`The Inquisitor looks into ${release(k,true)}'s eyes and sees someone else looking back. You lose them. (+10 suspicion)`,'bad');}});
  }
  // the Magister's order lands
  if(S.mag.edict){const e=S.mag.edict;S.mag.edict=null;S.mag.eta=S.sus>=60?3:S.sus>=30?4:6;EDICTS[e.id].hit(e);}
  if(checkSus()) return;
  // the Illithid
  const idle=!S.chan;
  S.ill.base+=growth();
  S.turn++;
  if(idle) log('You left the Illithid idle. Unused, it rests and gathers itself. (Illithid +1 power)','ill');
  const n=S.ill.next, sg=surge(), push=pushOf(S.ill.base)+sg;
  if(n.spike){S.ill.spikeChance=.10;log(`THE ILLITHID SURGES! It throws ${push} force against your will.`+(sg<n.amt?` Your clergy's vigil blunts it by ${n.amt-sg}.`:''),'ill');}
  else S.ill.spikeChance=Math.min(.6,S.ill.spikeChance+.07);
  if(S.ill.fedTurns>0) S.ill.fedTurns--;
  S.ap=Math.max(0,maxAP()-(S.curfew?1:0));S.curfew=false;S.chan=false;S.borrowed=false;S.cloak=false;S.quiet=false;S.pose=n.spike?'brace':'idle';
  for(const k in S.cd) if(S.cd[k]>0) S.cd[k]--;
  if(S.informers>0) S.informers--;
  if(S.wards>0) S.wards--;
  rollNext();
  moveInquisitor();
  const announced=moveMagister();
  // openings
  if(S.opp&&--S.opp.turns<=0) S.opp=null;
  if(!S.opp&&R()<.3){
    const c=[];INST.forEach((I,i)=>I.people.forEach((p,t)=>{if(!S.held[key(i,t)]&&S.inq.at!==i)c.push(key(i,t));}));
    if(c.length){const k=pick(c);S.opp={k,turns:2,why:pick(OPPS)};
      log(`An opening: ${nameOf(k)} ${S.opp.why}. For two nights they can be taken at half cost, whatever their rank.`,'gold');}
  }
  if(free()<push) return breakMenu(push);
  if(!n.spike) log(`The Illithid presses with ${push} force. You hold.`);
  render();
  if(!announced&&S.turn>2&&R()<.4) fireEvent();
}
function moveInquisitor(){
  const q=S.inq;
  if(q.at>=0){ if(--q.stay<=0){log(`The Inquisitor leaves ${INST[q.at].name}.`);q.at=-1;q.eta=S.sus>=50?3:5;} }
  else if(q.next>=0){ q.at=q.next;q.next=-1;q.stay=2;log(`Inquisitor Maldane Roake is searching ${INST[q.at].name}. Each thrall there may be exposed at nightfall.`,'bad'); }
  else if(--q.eta<=0){
    const c=thralls().map(instOf);
    q.next=c.length?c[Math.floor(R()*c.length)]:Math.floor(R()*INST.length);
    log(`Word from the street: the Magister's Inquisitor will search ${INST[q.next].name} tomorrow night.`,'bad');
  }
}
function breakMenu(push){
  S.pending={push};S.pose='brace';render();
  const list=thralls();
  if(S.mind<push) return end(false,`The Illithid hits with ${push} force. Even with every thrall let go, your mind cannot hold it. It wears you now.`);
  modal(`<h2 class="ill">Your grip is failing</h2><p>The Illithid pushes with <b>${push}</b> force. You have only <b>${free()}</b> free mind. Snap your hold on thralls to reclaim focus. Each snapped thrall wakes screaming (+5 suspicion).</p>`+
    list.map(k=>`<button style="margin:3px" onclick="snap('${k}')">Snap ${nameOf(k)} (+${TIER[tierOf(k)].upkeep})</button>`).join('')+
    `<p><button class="danger" onclick="end(false,'You let go. The Illithid takes your body for its own. Dangerous servant, cruel master.')">Give in</button></p>`);
}
function snap(k){
  const push=S.pending.push;
  closeModal();const p=release(k,true);S.sus+=5;
  log(`You tear free of ${p} to brace yourself.`,'bad');
  if(free()<push) return breakMenu(push);
  S.pending=null;
  log(`You hold against it with ${free()} free mind.`,'good');
  render();checkSus();
}
function checkSus(){
  if(S.sus>=100&&!S.over){end(false,'The High Magister has found you. His wards close around your garret and he takes the Illithid for himself.');return true;}
  return false;
}
function end(win,msg){
  S.over=true;S.pending=null;render();
  modal(`<h2 class="${win?'good':'bad'}">${win?'Vengeance':'Game over'}</h2><p>${msg}</p><p>Nights: ${S.turn} · Subversion: ${S.sub} · Thralls held: ${thralls().length}</p><button class="primary" onclick="closeModal();newGame()">Play again</button>`);
}

  $('map').innerHTML=h+'<g id="mapdyn"></g>';

// ---------- UI ----------
function modal(h){$('mbody').innerHTML=h;$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}
function pct(v,max){return Math.max(0,Math.min(100,v/max*100))+'%';}
function detail(){
  if(S.sel==='spire'){
    const ok=has('coll',2)&&S.sub>=100;
    return `<h3>The Spire</h3><div class="perk">Seat of High Magister Veyl Sarrow. To face him you need Caldreth fully subverted (${S.sub}/100) and the Collegium's Provost as your thrall (${has('coll',2)?'held':'not held'}).</div>
    <div class="perk">When you strike, the Illithid hits back with twice its nightly push (${Math.round(tonight()*2)} right now). Your free mind must be at least that, and with only the Provost held you could free ${S.mind-11}. Every night you wait, it grows.${Math.round(tonight()*2)>MAXMIND-11-8?' <span class="bad">The window is closing.</span>':''}</div>
    <button class="primary" ${ok&&S.ap>0&&!S.over?'':'disabled'} onclick="confront()">Confront the High Magister</button>`;
  }
  const i=S.sel,I=INST[i],here=S.inq.at===i;
  let h=`<h3>${I.name}</h3><div class="perk">${I.perk}</div>`;
  if(here) h+=`<div class="perk bad">Inquisitor Roake is here. Each thrall has a ${Math.round(exposeChance()*100)}% chance of exposure at nightfall, and you cannot take anyone new.<br>
    <button ${S.ap>0&&!S.cloak?'':'disabled'} onclick="cloak()" style="margin-top:4px">${S.cloak?'Cloaked tonight':'Cloak thralls (1 action)'}</button>
    <button class="risk" ${S.ap>0?'':'disabled'} onclick="seize()" style="margin-top:4px">Seize his mind (50%)</button></div>`;
  const sc=SCHEME[I.id];
  if(sc){const cd=S.cd[I.id]||0,ok=agent(I.id)&&!cd&&S.ap>0&&!S.over&&(I.id!=='coin'||(S.gold>=20&&S.sus>0))&&(I.id!=='watch'||S.inq.at>=0||S.inq.next>=0)&&(I.id!=='court'||S.mag.edict);
    h+=`<div class="tgt"><div><b>${sc[0]}</b><small>${sc[1]}${agent(I.id)?(cd?` · ready in ${cd} night${cd>1?'s':''}`:''):' · needs a rank 2 thrall here'}</small></div><div class="btns"><button ${ok?'':'disabled'} onclick="scheme('${I.id}')">1 action</button></div></div>`;}
  I.people.forEach((p,t)=>{const k=key(i,t),T=TIER[t],held=S.held[k],opp=isOpp(k);
    const base=!S.over&&S.ap>0&&free()>=T.upkeep&&!here;
    const canD=base&&S.gold>=goldCost(i,t)&&(t===0||S.held[key(i,t-1)]||opp);
    h+=`<div class="tgt ${held?'held':''}"><div><b>${p}</b><small>Rank ${t+1} · holds ${T.upkeep} mind · ${goldCost(i,t)} gold${opp?' <span class="gold">(opening: '+S.opp.turns+' night'+(S.opp.turns>1?'s':'')+')</span>':''}</small></div><div class="btns">`+
      (held?`<button onclick="release('${k}')">Release</button>`:
       `<button ${canD?'':'disabled'} title="Certain. Needs the gold and the rank below." onclick="take(${i},${t})">Dominate</button>

  return h;
}
function render(){

  $('mIll').style.left=pct(u,MAXMIND);$('mIll').style.width=pct(p,MAXMIND);
  $('mFree').style.left=pct(u+p,MAXMIND);$('mFree').style.width=pct(Math.max(0,m),MAXMIND);
  $('mFree').style.background=m>=22?'var(--mind)':m>=8?'#d0a040':'var(--sus)';
  $('mTxt').innerHTML=`Mind ${S.mind}/${MAXMIND}: <span style="color:#b0a8bc">■ thralls hold ${u}</span> · <span class="ill">■ the Illithid pushes ${tonight()} tonight</span> · `+(m<0?`<b class="bad">SHORT BY ${-m}: it breaks through tonight</b>`:`<span style="color:${m>=22?'var(--mind)':m>=8?'#d0a040':'var(--sus)'}">■ spare will ${m}</span>`+(m<22?' (a surge of 8 to 22 could break it)':''));

  $('endbtn').className=m<0?'danger':'primary';
  $('sBar').style.width=pct(S.sus,100);$('sTxt').textContent=`${S.sus}/100`+(S.sus>=50?' · the Inquisitor hunts faster':'');
  $('vBar').style.width=pct(S.sub,100);$('vTxt').textContent=`${S.sub}/100`;
  // cell
  const c=S.ill.spikeChance,a=c<.2?0:c<.35?1:c<.5?2:3,press=tonight()/Math.max(1,free()),cr=press<.6?0:press<.8?1:press<1?2:3;
  $('cell').setAttribute('class',`a${a} c${cr} ${S.ill.fedTurns?'sated':''}`);
  $('aura').setAttribute('r',40+Math.min(1.2,press)*90);
  $('ward1').style.opacity=Math.max(.15,1-press*.8);$('ward2').style.opacity=Math.max(.1,1-press);
  $('iOmen').textContent=(S.ill.fedTurns?`Sated for ${S.ill.fedTurns} more night${S.ill.fedTurns>1?'s':''}. `:'')+['It is quiet. Too quiet.','You feel it testing the edges of your will.','Whispers. It is gathering itself.','It is coiled to strike. A surge is coming.'][a];
  $('iRest').innerHTML=`Power ${S.ill.base}. `+(S.chan?'You worked it hard tonight; it stays tired.':'<span class="bad">Idle tonight: it will rest and gain +1 power.</span>');
  const n=S.ill.next;
  $('iIntel').textContent=has('under',2)?(n.spike?`The Mother of Keys: a surge of +${surge()} comes tonight.`:'The Mother of Keys: no surge tonight.'):
    has('under',1)?(n.spike?'Old Marrow: it will surge tonight.':'Old Marrow: no surge tonight.'):
    has('under',0)?`Nim's guess: ${Math.round(c*100)}% chance of a surge tonight (they add 8 to 22).`:'Surges add 8 to 22 without warning. Spies in the Undercroft could warn you.';
  // garret
  $('sanct').setAttribute('class','p-'+S.pose);
  $('trap').style.opacity=Math.min(1,.15+press*.7);
  $('pcap').textContent=POSE[S.pose];
  // the Magister
  const e=S.mag.edict;let mh;
  if(e){const q=EDICTS[e.id],by=INST.find(x=>x.id===q.by);
    mh=`<b class="bad">At dawn the High Magister ${q.say(e)}.</b> <button ${agent(q.by)&&S.ap>0&&!S.over?'':'disabled'} onclick="counter()">Stop it (1 action)</button><br><span class="dim">Needs a rank 2 thrall in ${by.name}, or a voice in the Lantern Court.</span>`;}
  else mh=`<span class="dim">High Magister Veyl Sarrow ${S.sus<30?'suspects nothing yet.':S.sus<60?'has begun asking questions. His orders will come more often.':'knows someone is working against him. He will not rest.'}</span>`;
  const fl=[S.informers>0&&`informers' bounty (${S.informers})`,S.wards>0&&`mind-wards (${S.wards})`,S.quiet&&'festival crowds'].filter(Boolean);
  $('mag').innerHTML=mh+(fl.length?` <span class="gold">In force: ${fl.join(', ')}.</span>`:'');
  // side
  $('detail').innerHTML=detail();
  const g=Math.min(3+tiersIn('temple'),MAXMIND-S.mind);
  $('medS').textContent=g>0?`+${g} mind`:'Mind is at its limit';
  $('bMed').disabled=S.ap<1||g<=0;$('bLie').disabled=S.ap<1||S.sus<=0;$('bBor').disabled=S.borrowed;$('bFeed').disabled=S.ap<1||!thralls().length;
  $('log').innerHTML=S.log.join('');
  drawMap();
}
buildMap();
newGame();
modal(`<h1>Dangerous Servant / Cruel Master</h1>
<p>The High Magister Veyl Sarrow burned your family and then broke you in open duel. You crawled away with one idea left: mind magic, which no human may wield unless they have survived a mind attack and turned it back on the creature that made it.</p>
<p>So you summoned an Illithid. It struck, you barely held, and now it sits in a cell beneath your garret. Through it you can bend minds across the city of Caldreth. It never stops pushing to break free, and <b>every night it grows stronger</b>.</p>
<p><b>How to play.</b> Click a place on the map to see who can be taken there. <i>Dominate</i> is certain but needs gold and the rank below; <i>Force</i> needs neither, and can fail badly. Each thrall holds part of your mind. The bar at the top shows what is left against tonight's push, and a surge can add 8 to 22 without warning.</p>
<p><b>You cannot wait it out.</b> A night in which you do not work the Illithid lets it rest and gain power. The Magister's Inquisitor walks the city looking for your thralls, and the Magister himself issues orders against you that only the right thrall in the right place can stop. Every institution protects you in a different way, so read what each one offers. Subvert Caldreth to 100, take the Collegium's Provost, then climb the Spire before the thing in the cell outgrows you.</p>
<button class="primary" onclick="closeModal()">Begin</button>`);
